[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imei-validator"
version = "0.1.0"
description = "Correctness-focused IMEI (Luhn checksum) and device serial number format validation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ivan Pinhal Rodrigues" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Ivan-Pinhal-Rodrigues/imei-validator"

[tool.hatch.build.targets.wheel]
packages = ["src/imei_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
